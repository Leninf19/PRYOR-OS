name: SCRATCH - Identity Repair Validation (throwaway, not production)

# Temporary, throwaway validation harness for the review-identity repair --
# added to main ONLY because GitHub requires a workflow_dispatch workflow to
# exist on the default branch to be dispatchable at all (a platform
# limitation, not a design choice). workflow_dispatch-only, never scheduled,
# touches no other file, gates nothing, and will be removed once validation
# is complete. The actual code it runs comes from whatever --ref it's
# dispatched against.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic cryptography

      - name: Run identity regression tests (tests/test_db.py)
        run: python tests/test_db.py

      - name: Run full Python regression suite
        if: always()
        run: python tests/run_all.py
