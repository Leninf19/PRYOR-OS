name: Historical Import

# One-time reconciliation between the existing scraped review history and
# the Google Business Profile API (gbp_import.py). Deliberately
# workflow_dispatch-only -- never scheduled -- since this is a manual,
# reviewed action, not part of the recurring sync (that's update-reviews.yml
# running gbp_sync.py). Defaults to a dry run; the reconciliation report is
# always written to the job summary so it's readable without a DB copy.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually write changes (unchecked = dry-run report only)'
        type: boolean
        default: false

# Shared with every other workflow that commits to dashboard/reviews.db --
# see update-reviews.yml for the full rationale. This must not run
# concurrently with any of them: it rewrites review rows wholesale, which
# is exactly the kind of change a concurrent scraper/sync commit could
# otherwise silently clobber or be clobbered by.
concurrency:
  group: reviews-db-writer
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # cryptography is required here: gbp_import.py -> google_api.py
      # imports AESGCM to decrypt the securely stored Google refresh token
      # (Phase 8, Milestone 8.8). This step never installed it, so any run
      # of this workflow would crash with "ModuleNotFoundError: No module
      # named 'cryptography'" before ever reaching the import logic below --
      # this bug was dormant only because this workflow had never been
      # triggered yet.
      - name: Install Python dependencies
        run: pip install anthropic cryptography

      - name: Run historical import
        id: import
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python gbp_import.py --apply | tee import_output.txt
          else
            python gbp_import.py | tee import_output.txt
          fi
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Phase 8, Milestone 8.8 -- see the matching comment in
          # critical-alert-check.yml.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}

      - name: Write report to job summary
        if: always()
        run: |
          echo "## Historical Import — mode: ${{ inputs.apply && 'APPLY (changes written)' || 'DRY RUN (no changes written)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat import_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f gbp_import_report.json ]; then
            echo "### Full reconciliation report (gbp_import_report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat gbp_import_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify database integrity before commit
        id: integrity
        if: always() && inputs.apply
        run: python check_db_integrity.py

      - name: Commit updated data
        if: inputs.apply && steps.integrity.outcome == 'success'
        run: 'bash .github/scripts/commit_and_push.sh "chore: historical import applied [skip ci]" dashboard/reviews.db'
