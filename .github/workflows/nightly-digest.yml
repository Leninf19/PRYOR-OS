name: Nightly Review Digest

# Targets 10pm America/New_York, which GitHub's UTC-only cron can't express
# directly across DST. Two cron entries bracket it (02:00 UTC = 10pm EDT,
# 03:00 UTC = 10pm EST); nightly_digest.py itself checks the real local hour
# and exits quietly unless it's actually 10pm ET, so exactly one of these
# two firings does anything on any given day. See nightly_digest.py.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'

# Shared with every other workflow that commits to dashboard/reviews.db --
# see update-reviews.yml for the full rationale.
concurrency:
  group: reviews-db-writer
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Multi-Tenant Phase 4D revision: check_db_integrity.py's --tenant-id
    # is REQUIRED, no default. nightly_digest.py itself is not yet
    # tenant-aware (see the Phase 4D report) -- it still operates against
    # db.py's hardcoded default path, which for Los Tres Amigos is
    # byte-for-byte the same file this TENANT_ID resolves to, so there is
    # no behavior change for LTA today, but this must be revisited before
    # a second tenant runs this workflow.
    env:
      TENANT_ID: t_los-tres-amigos

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install tzdata

      - name: Run nightly digest
        run: python nightly_digest.py --tenant-id "$TENANT_ID"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Verify database integrity before commit
        if: always()
        id: integrity
        run: python check_db_integrity.py --tenant-id "$TENANT_ID"

      - name: Commit updated data
        if: always() && steps.integrity.outcome == 'success'
        run: 'bash .github/scripts/commit_and_push.sh "chore: nightly digest housekeeping [skip ci]" dashboard/reviews.db'
