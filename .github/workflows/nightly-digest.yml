name: Nightly Review Digest

# Targets 10pm America/New_York, which GitHub's UTC-only cron can't express
# directly across DST. Two cron entries bracket it (02:00 UTC = 10pm EDT,
# 03:00 UTC = 10pm EST); nightly_digest.py itself checks the real local hour
# and exits quietly unless it's actually 10pm ET, so exactly one of these
# two firings does anything on any given day. See nightly_digest.py.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'

# Shared with every other workflow that commits to dashboard/reviews.db --
# see update-reviews.yml for the full rationale.
concurrency:
  group: reviews-db-writer
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install tzdata

      - name: Run nightly digest
        run: python nightly_digest.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Verify database integrity before commit
        if: always()
        run: python check_db_integrity.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: nightly digest housekeeping [skip ci]"
          git add dashboard/reviews.db
          git diff --staged --quiet && exit 0
          git commit -m "$MSG"
          # concurrency: above serializes this against every other
          # reviews.db writer. A rejected push means main moved for some
          # other reason -- fail loudly rather than reset+recommit (that
          # previously risked overwriting newer data, see update-reviews.yml).
          if ! git push; then
            echo "::error::git push rejected -- main has moved since this job started. This run's changes were NOT saved. Re-run this workflow once main is stable; no automatic reset/recommit is attempted."
            exit 1
          fi
