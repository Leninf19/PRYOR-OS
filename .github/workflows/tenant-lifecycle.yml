name: Tenant Lifecycle Operations

# Multi-Tenant Phase 4H.1 -- the ONLY dispatch surface for provisioning or
# Initial-Syncing a BLOB-mode tenant. This workflow does not implement
# provisioning or synchronization itself -- it is a thin, validated
# dispatch boundary around the SAME provision_tenant.py / initial_sync.py
# Python entrypoints already reviewed and tested (Phase 4F.1/4G). Every
# CAS, ETag, credential, approved-location, and status precondition those
# scripts enforce is completely unchanged and untouched here; this
# workflow never converts one of their failures into a successful
# workflow result, and never retries a stale-CAS/stale-ETag race
# automatically -- a human re-dispatches if a retry is warranted.
#
# "Retrying initial_sync after initial_sync_failed" is NOT a third
# operation choice: initial_sync.py's own status gate already accepts
# 'initial_sync_failed' as a valid starting state (see that script's
# header) -- re-running the `initial_sync` operation IS the retry.
#
# Deliberately excluded from tests/test_workflow_tenant_ids.py's
# TENANT_AWARE_SCRIPTS discipline (see WORKFLOWS_WITH_NO_TENANT_AWARE_SCRIPT
# in that file) -- unlike Los Tres Amigos's fixed pipeline scripts (which
# must NEVER accept a dispatch-supplied tenant id), provision_tenant.py/
# initial_sync.py are exactly the opposite: built to be invoked for an
# operator-chosen NEW tenant. Los Tres Amigos itself can never be targeted
# here -- see the "Validate inputs" step below (an explicit, redundant
# refusal), AND provision_tenant.py's/initial_sync.py's own independent,
# unconditional refusal of any non-BLOB storageMode tenant.
#
# No long-lived Vercel-to-GitHub token is introduced for this phase -- the
# dashboard's new Tenant Operations status page (Settings -> Tenant
# Operations, super-admin only) is read-only and links here; a human
# operator fills in and submits this dispatch form directly.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Which lifecycle operation to run"
        required: true
        type: choice
        options:
          - provision
          - initial_sync
          - apply_entitlement_change
          - diagnose_google_status
      tenant_id:
        description: "Tenant id, e.g. t_example-restaurant"
        required: true
        type: string
      confirmation:
        description: "Type the EXACT tenant id again to confirm"
        required: true
        type: string

# Serializes operations for the SAME tenant (two dispatches for the same
# tenant queue up rather than run concurrently, so the real defense --
# provision_tenant.py's/initial_sync.py's own configVersion/ETag CAS --
# is never even put under unnecessary pressure); different tenants still
# run independently, in parallel. cancel-in-progress: false -- a run
# already mutating this tenant's state must finish (or fail cleanly)
# rather than being killed mid-write by a newer dispatch for the SAME
# tenant; queued runs simply wait their turn -- matches
# update-reviews.yml's own reviews-db-writer concurrency group discipline.
concurrency:
  group: tenant-lifecycle-${{ inputs.tenant_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Every value below is read from `inputs.*` ONLY into an `env:` var
      # here, then referenced in the shell as a quoted "$VAR" -- never
      # `${{ inputs.* }}` interpolated directly into a run: script's text,
      # which would let a maliciously-crafted input inject arbitrary shell
      # syntax. This is the ONLY place tenant_id/confirmation are validated
      # before any later step ever touches a command, file path, Blob
      # pathname, or Redis key with them.
      - name: Validate inputs
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ ! "$TENANT_ID" =~ ^t_[a-z0-9-]+$ ]]; then
            echo "::error::tenant_id '$TENANT_ID' does not match the required format ^t_[a-z0-9-]+\$"
            exit 1
          fi
          if [[ "$TENANT_ID" == "t_los-tres-amigos" ]]; then
            echo "::error::Los Tres Amigos is not managed through this workflow -- it stays on its existing LEGACY_REPO pipeline (update-reviews.yml)"
            exit 1
          fi
          if [[ "$CONFIRMATION" != "$TENANT_ID" ]]; then
            echo "::error::confirmation must exactly match tenant_id -- refusing to proceed"
            exit 1
          fi
          echo "Validated tenant_id=$TENANT_ID operation=$OPERATION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # cryptography is required by google_api.py's credential decrypt
      # path (imported transitively by initial_sync.py, and by
      # tenant_status_report.py's has_tenant_credential() check below) --
      # same reasoning as update-reviews.yml's own install step.
      - name: Install Python dependencies
        run: pip install cryptography

      # Fixed command entry point, tenant id passed as a single, quoted
      # argument -- never string-built from operation/tenant_id. Only ONE
      # of these two steps ever runs per dispatch (mutually exclusive
      # `if:` conditions on the SAME, already-validated `inputs.operation`
      # choice value), so there is no dynamic command construction here at
      # all, just a fixed choice between two fixed commands.
      - name: Run provisioning
        if: inputs.operation == 'provision'
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python provision_tenant.py --tenant-id "$TENANT_ID"

      - name: Run Initial Sync
        id: run_initial_sync
        if: inputs.operation == 'initial_sync'
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        # initial_sync.py's own precondition check (google_api.has_tenant_credential)
        # requires a REAL, tenant-specific Redis-stored credential -- it
        # never falls back to a global GOOGLE_REFRESH_TOKEN, and this step
        # deliberately never sets that env var, so no such fallback is even
        # reachable for a new tenant dispatched here.
        run: python initial_sync.py --tenant-id "$TENANT_ID"

      # Phase B.12 (Decision 1) -- the PRIMARY, event-driven Subscription-
      # activation trigger for this manually-operated admin tool (Settings
      # -> Tenant Operations), mirroring the SAME step already added to
      # tenant-lifecycle-dispatch.yml's own automatic post-approval path --
      # see that file's own comment for the full design (canonical trial
      # activation + ensureSubscriptionActivation() via one authenticated,
      # idempotent, retried callback; never a secret this file already
      # uses for something else). This file has no Preview/Production
      # split at all -- every secret here is already the bare Production
      # name, so this single step uses BILLING_ACTIVATION_CALLBACK_SECRET
      # only, exactly like every other secret in this workflow.
      # SAFETY AUDIT ADDITION -- this file has NO environment/Preview
      # concept at all, so its "Activate billing" step always targets the
      # REAL Production callback URL with the REAL Production secret,
      # regardless of which branch this workflow was dispatched from. This
      # file's OTHER steps (provision_tenant.py/initial_sync.py) can only
      # ever succeed when dispatched from whatever branch currently hosts
      # the multi-tenant implementation (never main, by this repo's own
      # design -- see test_no_app_or_python_implementation_files_on_main),
      # so a bare `github.ref == 'refs/heads/main'` guard here does not
      # touch provisioning/initial-sync behavior at all -- it only means
      # THIS step is skipped when dispatched from a non-main branch,
      # safely deferring billing activation to tenantStatus()'s own
      # already-idempotent fallback polling instead of calling real
      # Production billing infrastructure from an unreviewed/non-main ref.
      - name: Activate billing
        id: activate_billing
        if: inputs.operation == 'initial_sync' && steps.run_initial_sync.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          BILLING_ACTIVATION_CALLBACK_SECRET: ${{ secrets.BILLING_ACTIVATION_CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          APP_BASE_URL="https://app.futuremark.studio"
          ATTEMPTS=5
          DELAY_SECONDS=5
          for attempt in $(seq 1 "$ATTEMPTS"); do
            HTTP_STATUS=$(curl -sS -o /tmp/billing_activation_response.json -w '%{http_code}' \
              --max-time 15 \
              -X POST "$APP_BASE_URL/api/session?action=billing-activation-callback" \
              -H "Authorization: Bearer $BILLING_ACTIVATION_CALLBACK_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"tenantId\":\"$TENANT_ID\"}") || HTTP_STATUS="000"
            if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
              echo "billing activation callback succeeded on attempt $attempt (HTTP $HTTP_STATUS) for tenant $TENANT_ID"
              cat /tmp/billing_activation_response.json || true
              exit 0
            fi
            echo "billing activation callback attempt $attempt/$ATTEMPTS failed (HTTP $HTTP_STATUS) for tenant $TENANT_ID"
            if [[ "$attempt" -lt "$ATTEMPTS" ]]; then
              sleep "$DELAY_SECONDS"
            fi
          done
          echo "::error::billing activation callback did not succeed after $ATTEMPTS attempts for tenant $TENANT_ID -- failing this workflow visibly rather than silently declaring complete billing activation"
          exit 1

      # Multi-Tenant Phase 4I.3 -- the data-plane follow-up for a platform
      # admin's entitlement change already COMMITTED to tenant_config by
      # dashboard/api/tenant-entitlements/[action].js (the mutation itself
      # happened in Node, atomically, before this was ever dispatched --
      # this step never decides what changed, only makes an already-approved
      # addition operational). Refuses outright (apply_entitlement_change.py's
      # own precondition check) if entitlementChange.status isn't 'pending'.
      - name: Apply entitlement change
        if: inputs.operation == 'apply_entitlement_change'
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python apply_entitlement_change.py --tenant-id "$TENANT_ID"

      # Phase 4M incident diagnosis -- READ-ONLY, makes no writes of any
      # kind (see diagnose_google_status.py's own header for the full
      # contract). Exists so CREDENTIAL_ENCRYPTION_KEY/GOOGLE_CLIENT_SECRET
      # (both Vercel Sensitive variables, unobtainable via `vercel env
      # pull`) can be used through this existing, already-trusted secret
      # store instead -- same tenant_id/confirmation validation above,
      # same per-tenant concurrency group, no new secret added.
      # Deliberately does NOT receive BLOB_READ_WRITE_TOKEN -- this
      # operation never touches Blob.
      - name: Diagnose Google status
        if: inputs.operation == 'diagnose_google_status'
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python diagnose_google_status.py --tenant-id "$TENANT_ID"

      # Runs regardless of whether the step(s) above succeeded or failed
      # (if: always()) purely so an operator can see the resulting state
      # either way -- this does NOT change the job's own pass/fail
      # conclusion: a prior step failing already marks the whole job
      # 'failure', and nothing below can retroactively turn that into a
      # success. Sanitized by construction -- see tenant_status_report.py's
      # own header for exactly what it will and will not print.
      - name: Write job summary
        if: always()
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          OPERATION: ${{ inputs.operation }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
        run: python tenant_status_report.py --tenant-id "$TENANT_ID" --operation "$OPERATION" >> "$GITHUB_STEP_SUMMARY"
