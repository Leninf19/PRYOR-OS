name: Update Reviews

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'    # ~every 6h; GitHub may delay scheduled runs under load

# Every workflow that commits to dashboard/reviews.db shares this same
# group, serializing them so two writers can never race to commit/push at
# once (the root cause of the git-race data-loss incident on 2026-07-16).
# cancel-in-progress: false -- a run already mutating the DB must finish
# (or fail cleanly) rather than being killed mid-write by a newer run
# starting; queued runs simply wait their turn instead.
concurrency:
  group: reviews-db-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # cryptography is required here: sync_reviews.py -> provider_gbp.py ->
      # google_api.py imports AESGCM to decrypt the securely stored Google
      # refresh token (Phase 8, Milestone 8.8), and export_chunks.py's
      # export_provider_health() hits the same import chain. This step never
      # installed it, so both steps crashed with "ModuleNotFoundError: No
      # module named 'cryptography'" -- masked here because later steps use
      # `if: always()`, so the workflow still appeared to "complete".
      - name: Install Python dependencies
        run: pip install playwright anthropic cryptography

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # TEMPORARY: gbp_sync.py (Google Business Profile API) is blocked by a
      # Google Cloud quota of 0 requests/minute on mybusinessaccountmanagement
      # .googleapis.com -- Basic API Access was approved but the quota itself
      # needs a separate increase request Google hasn't granted yet. Falling
      # back to the Playwright scraper so reviews keep flowing in the
      # meantime. No Google-linked rows exist yet (gbp_review_name is NULL on
      # every row), so this is a clean, collision-free switch. Once the quota
      # is granted, switch REVIEW_PROVIDER below from 'scraper' to 'gbp' --
      # see sync_reviews.py/provider_sync.py.
      - name: Sync reviews (scraper provider)
        id: scrape
        timeout-minutes: 30
        run: python sync_reviews.py
        env:
          REVIEW_PROVIDER: scraper
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Upload debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate data
        if: always()
        run: python validate.py

      - name: Refresh analytics
        if: always()
        run: python refresh_analytics.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Send alert notifications
        if: always()
        run: python notify.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Export intelligence data
        if: always()
        run: python export_chunks.py

      - name: Verify database integrity before commit
        if: always()
        id: integrity
        run: python check_db_integrity.py

      - name: Commit updated data
        if: always() && steps.integrity.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: pipeline run (+${{ steps.scrape.outputs.new_count || '0' }} reviews) [skip ci]"
          git add dashboard/reviews.csv dashboard/reviews.db
          git diff --staged --quiet && exit 0
          git commit -m "$MSG"
          # concurrency: above already prevents another reviews.db-writing
          # workflow from running at the same time. A rejected push here
          # means main moved for some other reason (e.g. an unrelated
          # manual commit) -- fail loudly rather than silently resolving it
          # by resetting onto remote and recommitting, which previously
          # risked overwriting newer review data with this run's older copy
          # (the root cause of the 2026-07-16 incident this replaces).
          if ! git push; then
            echo "::error::git push rejected -- main has moved since this job started. This run's changes were NOT saved. Re-run this workflow once main is stable; no automatic reset/recommit is attempted."
            exit 1
          fi

      - name: Set up Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy to Vercel
        if: always() && steps.integrity.outcome == 'success'
        run: |
          cd dashboard
          npm ci
          npm run build
          npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_mDA28eSShEIgPIQlduF4GJVH
          VERCEL_PROJECT_ID: prj_8Lj4p2UgPOVVwEZoRuuEpKy9L5gp

      - name: Send email notification
        # Gated on negative_count (new 1-2 star reviews only), NOT new_count
        # (which includes every rating and still drives the commit message
        # above, unchanged) -- this is the fix for the "positive reviews in
        # the new-reviews email" bug.
        if: steps.scrape.outputs.negative_count != '0' && steps.scrape.outputs.negative_count != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "${{ steps.scrape.outputs.negative_count }} new negative reviews – LTA Dashboard"
          to: advertising@l3amigos.com
          from: "LTA Review Dashboard <${{ secrets.GMAIL_USER }}>"
          html_body: ${{ steps.scrape.outputs.email_html }}
