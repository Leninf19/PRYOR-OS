name: Update Reviews

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'    # ~every 6h; GitHub may delay scheduled runs under load

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright anthropic

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # TEMPORARY: gbp_sync.py (Google Business Profile API) is blocked by a
      # Google Cloud quota of 0 requests/minute on mybusinessaccountmanagement
      # .googleapis.com -- Basic API Access was approved but the quota itself
      # needs a separate increase request Google hasn't granted yet. Falling
      # back to the Playwright scraper so reviews keep flowing in the
      # meantime. No Google-linked rows exist yet (gbp_review_name is NULL on
      # every row), so this is a clean, collision-free switch. Swap the two
      # lines below back once the quota is granted -- see gbp_sync.py.
      - name: Run scraper (temporary fallback -- see comment above)
        id: scrape
        run: python auto_update.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate data
        if: always()
        run: python validate.py

      - name: Refresh analytics
        if: always()
        run: python refresh_analytics.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Send alert notifications
        if: always()
        run: python notify.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Export intelligence data
        if: always()
        run: python export_chunks.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: pipeline run (+${{ steps.scrape.outputs.new_count || '0' }} reviews) [skip ci]"
          git add dashboard/reviews.csv dashboard/reviews.db
          git diff --staged --quiet && exit 0
          git commit -m "$MSG"
          # The scraper run takes ~14min, long enough to collide with the
          # 15-min critical-alert-check cron's own commit -- retry against
          # the latest remote tip rather than silently losing this run's
          # scraped reviews to a rejected push (found in production 2026-07-16).
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $attempt/5) -- rebasing our data onto the latest remote state and retrying..."
            git fetch origin main
            git reset --mixed origin/main
            git add dashboard/reviews.csv dashboard/reviews.db
            git commit -m "$MSG"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1

      - name: Set up Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy to Vercel
        if: always()
        run: |
          cd dashboard
          npm ci
          npm run build
          npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_mDA28eSShEIgPIQlduF4GJVH
          VERCEL_PROJECT_ID: prj_8Lj4p2UgPOVVwEZoRuuEpKy9L5gp

      - name: Send email notification
        if: steps.scrape.outputs.new_count != '0' && steps.scrape.outputs.new_count != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "${{ steps.scrape.outputs.new_count }} new reviews – LTA Dashboard"
          to: advertising@l3amigos.com
          from: "LTA Review Dashboard <${{ secrets.GMAIL_USER }}>"
          html_body: ${{ steps.scrape.outputs.email_html }}
