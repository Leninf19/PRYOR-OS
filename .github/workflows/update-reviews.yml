name: Update Reviews

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'    # ~every 6h; GitHub may delay scheduled runs under load

# Every workflow that commits to dashboard/reviews.db shares this same
# group, serializing them so two writers can never race to commit/push at
# once (the root cause of the git-race data-loss incident on 2026-07-16).
# cancel-in-progress: false -- a run already mutating the DB must finish
# (or fail cleanly) rather than being killed mid-write by a newer run
# starting; queued runs simply wait their turn instead.
concurrency:
  group: reviews-db-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # Multi-Tenant Phase 4C revision: the tenant-aware Python entrypoints
    # invoked below now REQUIRE an explicit --tenant-id -- there is no
    # default anywhere in that code, so a workflow that omitted it would
    # simply fail, not silently assume a tenant. This single, reviewed,
    # version-controlled value is this pipeline's explicit statement of
    # which tenant it runs for -- it is never derived from any
    # user-controlled input. This repo (and its one tenant's Google/data
    # pipeline) is Los Tres Amigos-only today; see the Multi-Tenant Phase
    # 4C report for the eventual multi-tenant workflow design.
    env:
      TENANT_ID: t_los-tres-amigos

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # cryptography is required here: sync_reviews.py -> provider_gbp.py ->
      # google_api.py imports AESGCM to decrypt the securely stored Google
      # refresh token (Phase 8, Milestone 8.8), and the data-export step
      # later in this workflow hits the exact same import chain. This step
      # never installed it, so both crashed with "ModuleNotFoundError: No
      # module named 'cryptography'" -- masked here because later steps use
      # `if: always()`, so the workflow still appeared to "complete".
      - name: Install Python dependencies
        run: pip install playwright anthropic cryptography

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # Google Cloud project migration resolved the prior quota block on
      # mybusinessaccountmanagement.googleapis.com -- verified via live,
      # successful critical-alert-check.yml and historical-import.yml runs
      # against the new project. Switching this pipeline's primary provider
      # from the Playwright scraper to the official Google Business Profile
      # API accordingly. The scraper (auto_update.py/provider_scraper.py)
      # remains in the repo, untouched, as the documented manual fallback --
      # see sync_reviews.py/provider_sync.py for provider selection.
      - name: Sync reviews (GBP provider)
        id: scrape
        timeout-minutes: 30
        run: python sync_reviews.py --tenant-id "$TENANT_ID"
        env:
          REVIEW_PROVIDER: gbp
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}

      - name: Upload debug snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-debug-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate data
        if: always()
        run: python validate.py --tenant-id "$TENANT_ID"

      - name: Refresh analytics
        if: always()
        run: python refresh_analytics.py --tenant-id "$TENANT_ID"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Send alert notifications
        if: always()
        run: python notify.py --tenant-id "$TENANT_ID"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Export intelligence data
        if: always()
        run: python export_chunks.py --tenant-id "$TENANT_ID"

      - name: Verify database integrity before commit
        if: always()
        id: integrity
        run: python check_db_integrity.py --tenant-id "$TENANT_ID"

      - name: Commit updated data
        if: always() && steps.integrity.outcome == 'success'
        run: 'bash .github/scripts/commit_and_push.sh "chore: pipeline run (+${{ steps.scrape.outputs.new_count || ''0'' }} reviews) [skip ci]" dashboard/reviews.csv dashboard/reviews.db'

      - name: Set up Node
        if: always()
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dashboard dependencies and build
        if: always() && steps.integrity.outcome == 'success'
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      # Final PRYOR Deployment Path Repair: the Vercel PROJECT's own "Root
      # Directory" setting is "dashboard" (deliberately left as-is -- not
      # changed by this fix). Running `vercel --prod` from INSIDE
      # dashboard/ (the prior `cd dashboard` here) made the CLI apply that
      # same "dashboard" root a SECOND time on top of an already-
      # dashboard-relative working directory, producing a real, confirmed
      # production failure: "Error: The provided path
      # ".../dashboard/dashboard" does not exist." Running this command
      # from the REPOSITORY ROOT instead lets the CLI resolve the
      # project's configured Root Directory exactly once, correctly, to
      # the real dashboard/ directory -- Vercel performs its own remote
      # build from there (using the project's configured Build/Install
      # Command) regardless of the local build above, which exists purely
      # as a pre-flight check that the build succeeds before spending a
      # deploy attempt on it.
      - name: Deploy to Vercel
        if: always() && steps.integrity.outcome == 'success'
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # PRYOR OS Controlled Production Release Preparation + Reconciliation:
          # these IDs previously pointed at a stale/legacy Vercel project --
          # every scheduled sync's deploy was landing somewhere other than
          # the real, currently-linked "pryor-os" project (see
          # .vercel/repo.json in this repo for the authoritative link),
          # which is why a demonstrably healthy, continuously-succeeding
          # sync pipeline never actually kept the live site's data fresh.
          # Corrected to the real project.
          VERCEL_ORG_ID: team_bzqEwLON2tvascgmnOtYAPi8
          VERCEL_PROJECT_ID: prj_rAhOLFWrKXB94ohCGiAdw3OY1ymo

      - name: Send email notification
        # Gated on negative_count (new 1-2 star reviews only), NOT new_count
        # (which includes every rating and still drives the commit message
        # above, unchanged) -- this is the fix for the "positive reviews in
        # the new-reviews email" bug.
        if: steps.scrape.outputs.negative_count != '0' && steps.scrape.outputs.negative_count != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "${{ steps.scrape.outputs.negative_count }} new negative reviews – LTA Dashboard"
          to: advertising@l3amigos.com
          from: "LTA Review Dashboard <${{ secrets.GMAIL_USER }}>"
          html_body: ${{ steps.scrape.outputs.email_html }}
