name: Critical Review Alert Check

# Deliberately independent of update-reviews.yml's ~6h cron -- this is a
# lightweight, frequent tripwire (sync just the newest review page per
# location + classify + check for unescalated critical reviews) so a
# critical review (food safety, injury, discrimination, legal concern)
# doesn't sit unnoticed until the next full pipeline run or the 10pm digest.
# See critical_alert_check.py and digest_filters.py.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic

      - name: Check for critical reviews
        run: python critical_alert_check.py
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: critical-alert check housekeeping [skip ci]"
          git add dashboard/reviews.db
          git diff --staged --quiet && exit 0
          git commit -m "$MSG"
          # This runs every 15min and can collide with the ~14min scraper's
          # own commit -- retry against the latest remote tip rather than
          # silently dropping the push (found in production 2026-07-16).
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt/3) -- rebasing onto the latest remote state and retrying..."
            git fetch origin main
            git reset --mixed origin/main
            git add dashboard/reviews.db
            git commit -m "$MSG"
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
