name: Critical Review Alert Check

# Deliberately independent of update-reviews.yml's ~6h cron -- this is a
# lightweight, frequent tripwire (sync just the newest review page per
# location + classify + check for unescalated critical reviews) so a
# critical review (food safety, injury, discrimination, legal concern)
# doesn't sit unnoticed until the next full pipeline run or the 10pm digest.
# See critical_alert_check.py and digest_filters.py.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# Shared with every other workflow that commits to dashboard/reviews.db --
# see update-reviews.yml for the full rationale.
concurrency:
  group: reviews-db-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # cryptography is required here: critical_alert_check.py -> gbp_sync.py
      # -> provider_gbp.py -> google_api.py imports AESGCM to decrypt the
      # securely stored Google refresh token (Phase 8, Milestone 8.8). This
      # step never installed it, so every run crashed with
      # "ModuleNotFoundError: No module named 'cryptography'" before ever
      # reaching the actual critical-review check below.
      - name: Install Python dependencies
        run: pip install anthropic cryptography

      - name: Check for critical reviews
        run: python critical_alert_check.py
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Phase 8, Milestone 8.8: tries the same live Redis-backed
          # credential store Settings -> Google Business Profile writes to
          # first, falling back to GOOGLE_REFRESH_TOKEN above if any of
          # these three are unset/unreachable -- see google_api.py's
          # _fetch_refresh_token_from_redis(). One-time setup, not stale on
          # every reconnect the way the refresh token itself is.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Verify database integrity before commit
        if: always()
        run: python check_db_integrity.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: critical-alert check housekeeping [skip ci]"
          git add dashboard/reviews.db
          git diff --staged --quiet && exit 0
          git commit -m "$MSG"
          # concurrency: above serializes this against every other
          # reviews.db writer. A rejected push means main moved for some
          # other reason -- fail loudly rather than reset+recommit (that
          # previously risked overwriting newer data, see update-reviews.yml).
          if ! git push; then
            echo "::error::git push rejected -- main has moved since this job started. This run's changes were NOT saved. Re-run this workflow once main is stable; no automatic reset/recommit is attempted."
            exit 1
          fi
