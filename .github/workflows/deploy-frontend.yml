name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '!dashboard/reviews.db'
      - '!dashboard/reviews.csv'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Multi-Tenant Phase 4C revision: export_chunks.py's --tenant-id is
    # REQUIRED, no default. This single, reviewed, version-controlled value
    # is this pipeline's explicit statement of which tenant it exports for.
    env:
      TENANT_ID: t_los-tres-amigos
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # export_chunks.py's export_provider_health() unconditionally imports
      # provider_gbp -> google_api, which (Phase 8, Milestone 8.8) imports
      # `cryptography` to decrypt the Redis-stored Google refresh token.
      # This step never installed it, so every run since Milestone 8.8
      # crashed with "ModuleNotFoundError: No module named 'cryptography'"
      # at the "Export data chunks" step below -- and because this workflow
      # has no `if: always()` on later steps, that failure silently
      # cancelled "Build and deploy to Vercel" every single time. This is
      # the root cause of git pushes not producing a production deployment.
      # `playwright` (also in requirements.txt) is deliberately NOT
      # installed here -- refresh_analytics.py/export_chunks.py never use
      # it, and it's a large, native-dependency package (greenlet) this
      # deploy path has no reason to carry.
      - name: Install Python dependencies
        run: pip install anthropic cryptography

      # This workflow must not assume dashboard/reviews.db already has fresh
      # analytics_cache rows from some other workflow's prior run -- that
      # assumption silently broke export_chunks.py's location-analytics
      # validation the first time a dashboard-only push landed on a commit
      # whose db hadn't yet been through refresh_analytics.py. Running it
      # here makes this workflow self-sufficient, matching update-reviews.yml's
      # own guaranteed order (refresh before export).
      - name: Refresh analytics
        run: python refresh_analytics.py --tenant-id "$TENANT_ID"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Export data chunks
        run: python export_chunks.py --tenant-id "$TENANT_ID"

      # Make GitHub Actions the single PRYOR production deployment owner:
      # same reasoning as update-reviews.yml's identically-named step -- a
      # silent export_chunks.py failure must never let `vercel --prod` below
      # ship stale or incomplete private-data. No `if: always()` gate here
      # (unlike update-reviews.yml): this workflow has none of the
      # `if: always()` steps that motivated that pattern there, so a failure
      # here simply fails the job and the Deploy step below never runs, via
      # GitHub Actions' own default step semantics.
      - name: Verify private-data artifacts before deploy
        run: python verify_private_data_artifacts.py --tenant-id "$TENANT_ID"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dashboard dependencies and build
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      # NON-BLOCKING (corrected after two real dispatches both failed here):
      # `vercel pull` cannot authenticate under CI's --token-only auth the
      # same way `vercel --prod` reliably does -- "Error: Could not retrieve
      # Project Settings", even with the identical VERCEL_TOKEN/org/project
      # env vars the Deploy step below uses successfully. This step stays
      # for diagnostics (its output is still visible in the job log) but
      # must never block a real deploy on an experimental check whose own
      # CI auth behavior isn't fixed yet -- continue-on-error: true. The
      # REQUIRED, blocking gate remains "Verify private-data artifacts
      # before deploy" above, which only depends on the local filesystem
      # and already proved reliable across every real run. Unlike
      # update-reviews.yml, this workflow's other steps have no `if` gate
      # either -- continue-on-error is the only mechanism needed here to
      # keep GitHub Actions' own default "failed step stops the job"
      # semantics from taking down the Deploy step below.
      - name: Build and verify serverless bundle includes required artifacts
        continue-on-error: true
        run: |
          npx vercel pull dashboard --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --yes --token=${{ secrets.VERCEL_TOKEN }}
          python verify_private_data_artifacts.py --tenant-id "$TENANT_ID" --bundle-config dashboard/.vercel/output/functions/api/data.func/.vc-config.json
        env:
          VERCEL_ORG_ID: team_bzqEwLON2tvascgmnOtYAPi8
          VERCEL_PROJECT_ID: prj_rAhOLFWrKXB94ohCGiAdw3OY1ymo

      # Final PRYOR Deployment Path Repair: the Vercel PROJECT's own "Root
      # Directory" setting is "dashboard" (deliberately left as-is -- not
      # changed by this fix). Running `vercel --prod` from INSIDE
      # dashboard/ (the prior `cd dashboard` here) made the CLI apply that
      # same "dashboard" root a SECOND time on top of an already-
      # dashboard-relative working directory, producing a real, confirmed
      # production failure: "Error: The provided path
      # ".../dashboard/dashboard" does not exist." Running this command
      # from the REPOSITORY ROOT instead lets the CLI resolve the
      # project's configured Root Directory exactly once, correctly, to
      # the real dashboard/ directory -- Vercel performs its own remote
      # build from there (using the project's configured Build/Install
      # Command) regardless of the local build above, which exists purely
      # as a pre-flight check that the build succeeds before spending a
      # deploy attempt on it.
      #
      # --force (Fix confirmed production /api/data 404s): forces a clean,
      # cache-free remote build for every deploy -- root-caused via a
      # controlled local reproduction showing a cache-free build correctly
      # includes every required file while every real deployment log
      # inspected during that investigation had restored build cache from a
      # prior deployment, chained back across many deploys. Never combined
      # with --with-cache, which would defeat the point.
      - name: Deploy to Vercel
        run: npx vercel --prod --force --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # PRYOR OS Controlled Production Release Preparation + Reconciliation:
          # these IDs previously pointed at a stale/legacy Vercel project --
          # every deploy from this workflow was landing somewhere other than
          # the real, currently-linked "pryor-os" project (see
          # .vercel/repo.json in this repo for the authoritative link),
          # meaning a push to main never actually reached the live site.
          # Corrected to the real project.
          VERCEL_ORG_ID: team_bzqEwLON2tvascgmnOtYAPi8
          VERCEL_PROJECT_ID: prj_rAhOLFWrKXB94ohCGiAdw3OY1ymo
