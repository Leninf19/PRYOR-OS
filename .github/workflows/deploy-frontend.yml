name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '!dashboard/reviews.db'
      - '!dashboard/reviews.csv'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic

      # This workflow must not assume dashboard/reviews.db already has fresh
      # analytics_cache rows from some other workflow's prior run -- that
      # assumption silently broke export_chunks.py's location-analytics
      # validation the first time a dashboard-only push landed on a commit
      # whose db hadn't yet been through refresh_analytics.py. Running it
      # here makes this workflow self-sufficient, matching update-reviews.yml's
      # own guaranteed order (refresh before export).
      - name: Refresh analytics
        run: python refresh_analytics.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Export data chunks
        run: python export_chunks.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and deploy to Vercel
        run: |
          cd dashboard
          npm ci
          npm run build
          npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_mDA28eSShEIgPIQlduF4GJVH
          VERCEL_PROJECT_ID: prj_8Lj4p2UgPOVVwEZoRuuEpKy9L5gp
