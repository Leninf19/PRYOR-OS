name: SCRATCH - Validation Flag Fix Validation (throwaway, not production)

# Temporary, throwaway validation harness -- added to main only because
# GitHub requires a workflow_dispatch workflow to exist on the default
# branch to be dispatchable at all. workflow_dispatch-only, never scheduled,
# touches no other file, gates nothing, will be removed once validation is
# complete. The actual code it runs comes from whatever --ref it's
# dispatched against.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic cryptography

      - name: Run validation-flag regression tests (tests/test_validate.py)
        run: python tests/test_validate.py

      - name: Run review-identity regression tests (tests/test_db.py)
        if: always()
        run: python tests/test_db.py

      - name: Scratch maintenance validation (if present)
        if: always()
        run: |
          if [ -f _scratch_validate_flags.py ]; then
            python _scratch_validate_flags.py
          else
            echo "no scratch maintenance driver present yet -- skipping"
          fi

      - name: Run full Python regression suite
        if: always()
        run: python tests/run_all.py

      - name: Production dashboard build
        if: always()
        run: |
          cd dashboard
          npm ci
          npm run build
