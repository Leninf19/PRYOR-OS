name: Diagnostic - Credential Migration Status

# Read-only, sanitized report of every tenant's Google OAuth client
# provenance (PRYOR OS Google Cloud project migration, Phase 8A) -- runs
# credential_migration_status.py, which performs exactly one Redis GET per
# tenant (never a write, never a Google API call, never a token
# decryption) and prints only tenant_id/clientKey classification/health/
# connectedAt. See that script's own module docstring and
# tests/test_google_oauth_clients.py's TestCredentialMigrationStatus class
# for the full, tested proof of those properties.
#
# Exists because Vercel treats UPSTASH_REDIS_REST_TOKEN as a write-only
# Sensitive variable in this project (confirmed empirically: `vercel env
# pull` returns it empty) -- GitHub Actions' own copy of the same secret is
# the only "ordinary configured credential path" this diagnostic can use.
#
# No CREDENTIAL_ENCRYPTION_KEY and no Google secrets are wired here on
# purpose: this script never decrypts a stored refresh token and never
# calls any Google API, so it has no use for either.
#
# workflow_dispatch only -- no schedule. Intended to be run on demand, not
# continuously.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run credential migration status
        run: python credential_migration_status.py
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
