name: scratch2

# Push-triggered instead of workflow_dispatch: dispatch-registration for a
# newly-added workflow_dispatch-only workflow was not becoming available via
# the API/CLI after repeated retries over 15+ minutes (a platform-side
# delay/issue, not a config problem -- an already-established workflow
# dispatched instantly in the same window). A push trigger fires directly
# from the committed file on the pushed ref with no separate registration
# step, sidestepping the issue entirely. Scoped to this one throwaway
# branch only; temporary, to be removed once validation is complete.
on:
  push:
    branches:
      - fix/validation-flag-growth

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install anthropic cryptography
      - run: python tests/test_validate.py
      - if: always()
        run: python tests/test_db.py
      - if: always()
        run: |
          if [ -f _scratch_validate_flags.py ]; then
            python _scratch_validate_flags.py
          else
            echo "no scratch maintenance driver present yet -- skipping"
          fi
      - if: always()
        run: python tests/run_all.py
      - if: always()
        run: |
          cd dashboard
          npm ci
          npm run build
