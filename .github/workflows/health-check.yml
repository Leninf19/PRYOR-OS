name: Health Check

# Runs on its own daily schedule, independent of update-reviews.yml's ~6h
# cron, so it keeps catching problems even if that workflow's trigger stops
# firing entirely (not just if an individual run errors).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

# Shared with every other workflow that commits to dashboard/reviews.db --
# see update-reviews.yml for the full rationale. This workflow wasn't in
# the original incident report but has the identical git-race pattern.
concurrency:
  group: reviews-db-writer
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Multi-Tenant Phase 4D revision: check_db_integrity.py's --tenant-id
    # is REQUIRED, no default. This single, reviewed, version-controlled
    # value is this workflow's explicit statement of which tenant's review
    # database it verifies before committing. health_check.py itself is
    # not yet tenant-aware (see the Phase 4D report) -- it still operates
    # against db.py's hardcoded default path, which for Los Tres Amigos is
    # byte-for-byte the same file this TENANT_ID resolves to, so there is
    # no behavior change for LTA today, but this must be revisited before
    # a second tenant runs this workflow.
    env:
      TENANT_ID: t_los-tres-amigos

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run health check
        run: python health_check.py --tenant-id "$TENANT_ID"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Verify database integrity before commit
        if: always()
        id: integrity
        run: python check_db_integrity.py --tenant-id "$TENANT_ID"

      - name: Commit notification log
        if: always() && steps.integrity.outcome == 'success'
        run: 'bash .github/scripts/commit_and_push.sh "chore: health-check housekeeping [skip ci]" dashboard/reviews.db'
