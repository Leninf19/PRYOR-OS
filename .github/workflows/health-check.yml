name: Health Check

# Runs on its own daily schedule, independent of update-reviews.yml's ~6h
# cron, so it keeps catching problems even if that workflow's trigger stops
# firing entirely (not just if an individual run errors).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run health check
        run: python health_check.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Commit notification log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: health-check housekeeping [skip ci]"
          git add dashboard/reviews.db
          git diff --staged --quiet && exit 0
          git commit -m "$MSG"
          # Retry against the latest remote tip rather than silently dropping
          # the push if another workflow committed first (found in
          # production 2026-07-16).
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt/3) -- rebasing onto the latest remote state and retrying..."
            git fetch origin main
            git reset --mixed origin/main
            git add dashboard/reviews.db
            git commit -m "$MSG"
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
