name: Health Check

# Runs on its own daily schedule, independent of update-reviews.yml's ~6h
# cron, so it keeps catching problems even if that workflow's trigger stops
# firing entirely (not just if an individual run errors).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

# Shared with every other workflow that commits to dashboard/reviews.db --
# see update-reviews.yml for the full rationale. This workflow wasn't in
# the original incident report but has the identical git-race pattern.
concurrency:
  group: reviews-db-writer
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run health check
        run: python health_check.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Verify database integrity before commit
        if: always()
        run: python check_db_integrity.py

      - name: Commit notification log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: health-check housekeeping [skip ci]"
          git add dashboard/reviews.db
          git diff --staged --quiet && exit 0
          git commit -m "$MSG"
          # concurrency: above serializes this against every other
          # reviews.db writer. A rejected push means main moved for some
          # other reason -- fail loudly rather than reset+recommit (that
          # previously risked overwriting newer data, see update-reviews.yml).
          if ! git push; then
            echo "::error::git push rejected -- main has moved since this job started. This run's changes were NOT saved. Re-run this workflow once main is stable; no automatic reset/recommit is attempted."
            exit 1
          fi
