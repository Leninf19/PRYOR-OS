name: Diagnostic - Run Python Test Suite

# One-off verification: confirms tests/test_location_analytics.py's
# WinError 32 (file locked) failure, reproduced locally on Windows after
# the tenant-isolated-review-contact change, does NOT occur on the actual
# CI/production runtime (ubuntu-latest has no Windows-style mandatory file
# locking) -- i.e. confirms it's a local-Windows-dev-only artifact, not a
# real regression. Runs no network calls (no ANTHROPIC_API_KEY/UPSTASH
# secrets passed) -- every test in this suite is designed to degrade
# gracefully without them.
#
# workflow_dispatch only. Meant to be deleted once this investigation
# concludes -- not reusable operator tooling.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install cryptography

      - name: Run test_location_analytics.py
        run: python tests/test_location_analytics.py

      - name: Run test_response_policy.py
        run: python tests/test_response_policy.py

      - name: Run test_export_chunks.py
        run: python tests/test_export_chunks.py

      - name: Run test_backfill_sentiment.py
        run: python tests/test_backfill_sentiment.py
